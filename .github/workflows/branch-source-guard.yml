name: Branch Source Guard

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Base branch: $BASE_REF"
          echo "Head branch: $HEAD_REF"

          if [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "develop" ] && [[ "$HEAD_REF" != release-please--* ]]; then
              echo "::error::PRs para 'main' só podem vir da branch 'develop' (ou do PR automático do release-please). Branch atual: '$HEAD_REF'."
              exit 1
            fi
          elif [ "$BASE_REF" = "develop" ]; then
            if [[ "$HEAD_REF" != feature/* ]]; then
              echo "::error::PRs para 'develop' só podem vir de branches 'feature/<nome-da-demanda>'. Branch atual: '$HEAD_REF'."
              exit 1
            fi
          fi

          echo "OK: origem da branch validada."
